name: Daily metrics refresh

on:
  schedule:
    # 02:00 UTC = 07:30 IST
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull latest metric data from Metabase
        env:
          METABASE_KEY: ${{ secrets.METABASE_KEY }}
        run: python3 refresh.py

      - name: Rebuild static dashboard
        run: python3 build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json index.html
          git diff --staged --quiet || git commit -m "Daily metrics refresh"
          git push

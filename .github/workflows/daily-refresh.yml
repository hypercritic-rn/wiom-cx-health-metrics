name: Daily metrics refresh

on:
  schedule:
    # The Slack routines fire at 04:30-04:31 UTC and need data <12h old.
    # GitHub delays this repo's scheduled runs by 2-6+ hours (observed
    # 27 Aug - 1 Sep 2026; the tight 00:23/02:23/03:23 spread all missed the
    # window on 1 Sep). Key fact: every metric is D-1 (IST), and yesterday-IST
    # is complete at 18:30 UTC -- so refreshing from the previous EVENING
    # already captures the full D-1. Spread attempts across the night so even
    # a 6h delay lands fresh data before 04:31 UTC. The job is idempotent:
    # a repeat run just recommits the latest numbers.
    - cron: '23 19 * * *'  # 00:53 IST -- first full-D-1 slot
    - cron: '23 21 * * *'  # 02:53 IST
    - cron: '23 1 * * *'   # 06:53 IST
    - cron: '23 3 * * *'   # 08:53 IST (last chance before 10:01 IST routines)
  workflow_dispatch: {}

# never run two refreshes at once -- a delayed cron catching up while another
# attempt is mid-push would race on the commit
concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull latest metric data from Metabase
        env:
          METABASE_KEY: ${{ secrets.METABASE_KEY }}
        run: python3 refresh.py

      - name: Rebuild static dashboard
        run: python3 build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json index.html
          git diff --staged --quiet || git commit -m "Daily metrics refresh"
          # master may move during the 10-15 min run (config/code pushes) --
          # replay the data commit on top of it; on any conflict keep OUR
          # freshly generated files (-X theirs = the replayed commit in rebase)
          git fetch origin
          git rebase -X theirs origin/master
          git push

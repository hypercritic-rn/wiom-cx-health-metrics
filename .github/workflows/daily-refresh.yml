name: Daily metrics refresh

on:
  schedule:
    # Three attempts before the 04:31 UTC Slack routines, on odd minutes --
    # GitHub delays on-the-hour scheduled runs by hours under load (observed
    # 6-12h drift on the single '0 2 * * *' cron, 27-31 Aug 2026), so give the
    # refresh several chances to land fresh data in time. The job is
    # idempotent: a repeat run just recommits the latest numbers.
    - cron: '23 0 * * *'   # 05:53 IST
    - cron: '23 2 * * *'   # 07:53 IST
    - cron: '23 3 * * *'   # 08:53 IST (last chance before 10:01 IST routines)
  workflow_dispatch: {}

# never run two refreshes at once -- a delayed cron catching up while another
# attempt is mid-push would race on the commit
concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull latest metric data from Metabase
        env:
          METABASE_KEY: ${{ secrets.METABASE_KEY }}
        run: python3 refresh.py

      - name: Rebuild static dashboard
        run: python3 build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json index.html
          git diff --staged --quiet || git commit -m "Daily metrics refresh"
          # master may move during the 10-15 min run (config/code pushes) --
          # replay the data commit on top of it; on any conflict keep OUR
          # freshly generated files (-X theirs = the replayed commit in rebase)
          git fetch origin
          git rebase -X theirs origin/master
          git push
